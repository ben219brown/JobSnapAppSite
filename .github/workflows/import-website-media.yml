name: Import JobSnapApp website media

on:
  push:
    paths:
      - ".github/workflows/import-website-media.yml"
      - ".upload/jobsnap-screenshots-web.zip"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import screenshots
        shell: bash
        run: |
          mkdir -p images/website-2026
          unzip -o .upload/jobsnap-screenshots-web.zip -d images/website-2026
          rm -f .upload/jobsnap-screenshots-web.zip
          rm -f .github/workflows/import-website-media.yml
          rmdir .upload 2>/dev/null || true

      - name: Commit imported screenshots
        shell: bash
        run: |
          git config user.name "JobSnapApp Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import updated JobSnapApp website screenshots"
          git push
